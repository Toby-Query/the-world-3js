<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The World — Prototype</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="hud-column">
        <div class="panel" id="controls">
          <strong>Controls</strong>
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
          <div><kbd>Shift</kbd> Run / boost</div>
          <div><kbd>Space</kbd> Jump · again mid-air to fly</div>
          <div><kbd>F</kbd> Toggle flight</div>
          <div><kbd>Space</kbd><kbd>C</kbd> Fly up / down</div>
          <div><kbd>LMB</kbd> Use right hand · <kbd>RMB</kbd> left hand</div>
          <div><kbd>Mouse</kbd> Look · <kbd>Scroll</kbd> Zoom</div>
          <div><kbd>Esc</kbd> Release mouse</div>
        </div>
        <div class="panel" id="abilities">
          <strong>Abilities</strong>
        </div>
        <div class="panel" id="gear">
          <strong>Gear</strong>
        </div>
      </div>
      <div class="panel" id="stats">FPS   --</div>
    </div>

    <div id="start">
      <div class="start-card">
        <h1>The World</h1>
        <p>Click to play</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
