<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="30%" stop-color="#450a0a" />
      <stop offset="70%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="lavaRift" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="bifrostRainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="surtrFlame">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky: The Twilight of the Gods -->
  <rect width="800" height="350" fill="url(#twilightSky)" />

  <!-- The Shattered Bifröst Bridge (Prism Arc Fractured in the Clouds) -->
  <path d="M 50,220 C 180,60 380,40 520,110" fill="none" stroke="url(#bifrostRainbow)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <!-- Fractured Crystals Falling -->
  <polygon points="535,115 545,110 540,125" fill="#38bdf8" />
  <polygon points="555,130 562,122 558,138" fill="#f43f5e" />
  <polygon points="548,150 554,142 550,158" fill="#fbbf24" />

  <!-- Surtr's Titan Flaming Sword (Lævateinn) Piercing the Horizon -->
  <g transform="translate(620, 160) rotate(-18)">
    <polygon points="-8,-120 8,-120 14,80 -14,80" fill="#fbbf24" filter="url(#surtrFlame)" stroke="#ea580c" stroke-width="2" />
    <!-- Flame Plumes -->
    <path d="M -15,-60 Q -35,-90 -10,-130 Q 15,-100 25,-50" fill="#ea580c" opacity="0.6" filter="url(#surtrFlame)" />
    <!-- Crossguard -->
    <rect x="-35" y="80" width="70" height="14" rx="2" fill="#1e293b" stroke="#78350f" stroke-width="1" />
  </g>

  <!-- Sea of Boiling Steam & Dark Waves -->
  <rect y="350" width="800" height="150" fill="#090d16" />
  <path d="M0,370 Q200,350 400,370 T800,370" stroke="#ea580c" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M0,410 Q200,390 400,410 T800,410" stroke="#f97316" stroke-width="1.5" fill="none" opacity="0.3" />

  <!-- The Battlefield Island: Plain of Vigrid (120 Leagues Wide) -->
  <polygon points="80,400 180,240 450,220 700,310 760,420" fill="#1e1b4b" stroke="#334155" stroke-width="2" />

  <!-- Basalt Magma Fissures Running Across the Plain -->
  <path d="M 220,380 L 280,310 L 360,330 L 420,260 L 500,280" fill="none" stroke="url(#lavaRift)" stroke-width="5" filter="url(#surtrFlame)" />
  <path d="M 360,330 L 400,380 L 470,390" fill="none" stroke="url(#lavaRift)" stroke-width="3" filter="url(#surtrFlame)" />

  <!-- The Broken Monolith of Fenrir (Shattered Gleipnir Fetters) -->
  <g transform="translate(310, 240)">
    <!-- Basalt Anchor Stone -->
    <polygon points="-25,40 0,-30 25,40" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <!-- Golden Ribbon Gleipnir Snapped into Strands -->
    <path d="M -8,5 Q -25,-15 -45,0" fill="none" stroke="#fbbf24" stroke-width="3" />
    <path d="M 8,5 Q 30,-10 50,15" fill="none" stroke="#fbbf24" stroke-width="3" />
    <!-- Giant Wolf Shadow Silhouette in Background Smoke -->
    <path d="M 25,-40 C 40,-70 70,-75 85,-60 C 95,-50 90,-35 80,-25 Z" fill="#000000" opacity="0.75" />
    <circle cx="70" cy="-60" r="2" fill="#ef4444" />
  </g>

  <!-- The Dwarven World Forge (Brokkr & Sindri Crucible) -->
  <g transform="translate(180, 290)">
    <rect x="-30" y="0" width="60" height="40" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <polygon points="-30,0 0,-25 30,0" fill="#1e293b" />
    <!-- Molten Metal Flow -->
    <rect x="-8" y="15" width="16" height="25" fill="#f59e0b" filter="url(#surtrFlame)" />
    <!-- Anvil Silhouette -->
    <polygon points="40,25 65,25 60,38 45,38" fill="#475569" />
  </g>

  <!-- Frame & Caption -->
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.6" />
  <text x="30" y="475" fill="#fed7aa" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="2">THE PLAIN OF VIGRID &amp; THE WORLD FORGE • RAGNARÖK CLASH</text>
</svg>
