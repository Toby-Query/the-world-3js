<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ironHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="leatherWrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="lightningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="electricFilter">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="280" fill="#090e17" rx="8" />

  <!-- Thunder Glow behind Hammer Head -->
  <ellipse cx="250" cy="140" rx="140" ry="100" fill="url(#lightningGlow)" opacity="0.25" filter="url(#electricFilter)" />

  <!-- Lightning Arcs -->
  <path d="M 180,90 L 195,115 L 185,125 L 210,150 L 195,160 L 220,185" fill="none" stroke="#7dd3fc" stroke-width="2.5" filter="url(#electricFilter)" />
  <path d="M 310,80 L 295,110 L 315,120 L 290,165" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#electricFilter)" />

  <!-- Hammer Head Group -->
  <g transform="translate(250, 140)">
    <!-- Main Symmetrical Beveled Head -->
    <path d="M -70,-55 L 70,-55 L 85,-40 L 85,40 L 70,55 L -70,55 L -85,40 L -85,-40 Z" fill="url(#ironHead)" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Norse Knotwork / Triquetra on Face -->
    <path d="M0,-25 C15,-40 30,-15 15,5 C0,25 -25,20 -15,0 C-5,-20 20,-20 0,-25 Z" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#electricFilter)" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#e0f2fe" stroke-width="1.5" />

    <!-- Corner Relief Plates -->
    <polygon points="-80,-35 -70,-50 -55,-50 -70,-35" fill="#64748b" />
    <polygon points="80,-35 70,-50 55,-50 70,-35" fill="#64748b" />
    <polygon points="-80,35 -70,50 -55,50 -70,35" fill="#64748b" />
    <polygon points="80,35 70,50 55,50 70,35" fill="#64748b" />

    <!-- Handle Socket Ferrule -->
    <rect x="75" y="-12" width="20" height="24" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Characteristic Short Shaft (Dwarven Flaw by Loki's Fly) -->
  <g transform="translate(345, 140)">
    <!-- Ash Wood / Leather-wrapped Shaft -->
    <rect x="0" y="-10" width="160" height="20" rx="3" fill="url(#leatherWrap)" stroke="#92400e" stroke-width="1" />
    <!-- Criss-cross Thong Wrappings -->
    <line x1="20" y1="-10" x2="40" y2="10" stroke="#f59e0b" stroke-width="2" />
    <line x1="50" y1="-10" x2="70" y2="10" stroke="#f59e0b" stroke-width="2" />
    <line x1="80" y1="-10" x2="100" y2="10" stroke="#f59e0b" stroke-width="2" />
    <line x1="110" y1="-10" x2="130" y2="10" stroke="#f59e0b" stroke-width="2" />
    <!-- Pommel & Wrist Loop -->
    <rect x="160" y="-14" width="16" height="28" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 176,-4 C 210,-10 220,15 176,12" fill="none" stroke="#b45309" stroke-width="4" />
  </g>

  <!-- Labels and Technical Spec -->
  <text x="350" y="42" fill="#e0f2fe" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">MJÖLNIR (THE CRUSHER)</text>
  <text x="350" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Brokkr &amp; Sindri Forge • Svartálfaheimr • Wielder: Thor Odinson</text>

  <text x="350" y="235" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">KEY MECHANIC: GYROSCOPIC RECALL &amp; STORM ANCHOR</text>
  <text x="350" y="255" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Hurled to summon pinpoint thunderbolts; returns to iron gauntlets (Járngreipr) regardless of distance</text>

  <!-- Border -->
  <rect x="8" y="8" width="684" height="264" rx="6" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
