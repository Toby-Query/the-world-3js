<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="divineFeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="zephyrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="windGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="280" fill="#0b1329" rx="8" />

  <!-- Wind Vortex Glow -->
  <ellipse cx="350" cy="140" rx="180" ry="80" fill="url(#zephyrGlow)" opacity="0.18" filter="url(#windGlow)" />

  <!-- Wind Streamlines / Trajectory Lines -->
  <path d="M 120,180 C 220,200 450,210 580,180" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="8,4" opacity="0.5" />
  <path d="M 150,150 C 240,165 440,165 550,150" fill="none" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6" />

  <!-- The Sandal Profile (Sole & Golden Straps) -->
  <g transform="translate(250, 110)">
    <!-- Sandal Leather Sole -->
    <path d="M -30,65 C 20,63 110,65 170,55 C 190,52 210,48 200,60 C 180,72 130,75 50,75 C -10,75 -40,73 -30,65 Z" fill="#78350f" stroke="#b45309" stroke-width="2" />
    <path d="M -25,60 C 20,58 110,60 170,50 C 185,47 195,46 185,55 C 160,65 110,68 45,68 C -5,68 -30,66 -25,60 Z" fill="url(#goldLeather)" />

    <!-- Ankle Cuff / Thongs -->
    <path d="M 0,20 L 10,62 L 35,62 L 40,20 Z" fill="url(#goldLeather)" stroke="#d97706" stroke-width="1.5" />
    <path d="M -15,22 C 10,15 45,15 65,22 L 60,32 C 40,26 10,26 -10,32 Z" fill="#f59e0b" stroke="#b45309" />
    
    <!-- Toe Straps (Crossed Golden Thongs) -->
    <path d="M 100,58 L 135,38 L 145,43 L 115,60 Z" fill="#f59e0b" />
    <path d="M 140,56 L 105,38 L 95,43 L 125,60 Z" fill="#fbbf24" />

    <!-- The Divine Wing (Talaria Wing Assembly on Ankle) -->
    <g transform="translate(15, 15) rotate(-15)">
      <!-- Rear Feather Tier -->
      <path d="M0,0 C-30,-20 -70,-20 -90,0 C-80,-15 -50,-35 0,-15 Z" fill="#93c5fd" opacity="0.7" />
      <!-- Middle Feather Tier -->
      <path d="M0,0 C-40,-35 -90,-40 -120,-10 C-105,-30 -60,-55 0,-20 Z" fill="url(#divineFeather)" stroke="#bae6fd" stroke-width="1" />
      <path d="M0,-10 C-35,-45 -80,-50 -105,-25 C-95,-40 -50,-65 0,-30 Z" fill="#ffffff" filter="url(#windGlow)" />
      <!-- Primary Forward Feather Tier -->
      <path d="M0,0 C-50,-50 -110,-60 -140,-25 C-125,-50 -70,-80 0,-25 Z" fill="url(#divineFeather)" stroke="#7dd3fc" stroke-width="1.5" />
      
      <!-- Golden Wing Root Pin (Caduceus Knot) -->
      <circle cx="0" cy="0" r="10" fill="url(#goldLeather)" stroke="#fbbf24" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>
  </g>

  <!-- Labels and Technical Spec -->
  <text x="350" y="38" fill="#fef08a" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">TALARIA OF HERMES (ΠΤΗΝΟΠΕΔΙΛΟΣ)</text>
  <text x="350" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Forged by Hephaestus • Pure Imperishable Gold &amp; Zephyr Feathers • Wielder: Hermes / Perseus</text>

  <text x="350" y="240" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">KEY MECHANIC: HYDRO-GLIDE, TRIPLE JUMP &amp; VERTICAL AIR-BURST</text>
  <text x="350" y="260" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Allows seamless sprint atop oceanic waves, negates fall impacts, and unlocks mid-air lateral dashing</text>

  <!-- Border -->
  <rect x="8" y="8" width="684" height="264" rx="6" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
