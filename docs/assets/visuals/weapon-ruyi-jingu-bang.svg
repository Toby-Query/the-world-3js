<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
  <defs>
    <linearGradient id="ironShaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="crimsonEnergy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8" />
    </linearGradient>
    <filter id="relicGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Display Plinth Background -->
  <rect width="700" height="250" fill="#090d16" rx="8" />

  <!-- Background Aura -->
  <ellipse cx="350" cy="125" rx="280" ry="40" fill="#f59e0b" opacity="0.12" filter="url(#relicGlow)" />

  <!-- Main Shaft (Black Meteoric Iron / Sea-Pillar Iron) -->
  <rect x="70" y="116" width="560" height="18" rx="3" fill="url(#ironShaft)" stroke="#475569" stroke-width="1" />
  
  <!-- Central Taoist Runes on Shaft -->
  <text x="350" y="130" fill="#fbbf24" font-family="'SimSun', serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="8" filter="url(#relicGlow)">如意金箍棒 • 重一萬三千五百斤</text>

  <!-- Left Golden Ferrule Band -->
  <g transform="translate(70, 111)">
    <rect x="0" y="0" width="75" height="28" rx="4" fill="url(#goldBand)" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Dragon Engravings on Band -->
    <path d="M10,8 Q20,18 30,8 Q40,18 50,8 Q60,18 70,8" fill="none" stroke="#78350f" stroke-width="2" />
    <path d="M10,20 Q20,10 30,20 Q40,10 50,20 Q60,10 70,20" fill="none" stroke="#78350f" stroke-width="2" />
    <circle cx="3" cy="14" r="5" fill="#fef08a" />
  </g>

  <!-- Right Golden Ferrule Band -->
  <g transform="translate(555, 111)">
    <rect x="0" y="0" width="75" height="28" rx="4" fill="url(#goldBand)" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Dragon Engravings on Band -->
    <path d="M5,8 Q15,18 25,8 Q35,18 45,8 Q55,18 65,8" fill="none" stroke="#78350f" stroke-width="2" />
    <path d="M5,20 Q15,10 25,20 Q35,10 45,20 Q55,10 65,20" fill="none" stroke="#78350f" stroke-width="2" />
    <circle cx="72" cy="14" r="5" fill="#fef08a" />
  </g>

  <!-- Size-Expansion Indicator Arc Lines -->
  <path d="M 645,80 C 670,100 670,150 645,170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
  <path d="M 55,80 C 30,100 30,150 55,170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Label and Technical Spec -->
  <text x="350" y="45" fill="#fef08a" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">RUYI JINGU BANG (如意金箍棒)</text>
  <text x="350" y="68" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">As-You-Will Gold-Banded Cudgel • Weight: 13,500 Catty • Provenance: Dragon King of the Eastern Sea</text>

  <text x="350" y="195" fill="#f59e0b" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">KEY MECHANIC: SEISMIC REACH &amp; TECTONIC DENSITY SHIFT</text>
  <text x="350" y="215" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Can dynamically extend across ocean chasms or compress into ear-pouch storage</text>

  <!-- Border -->
  <rect x="8" y="8" width="684" height="234" rx="6" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
