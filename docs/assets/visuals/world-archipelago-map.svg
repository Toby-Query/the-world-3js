<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Background Ocean Gradients -->
    <radialGradient id="oceanGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1a36" />
      <stop offset="60%" stop-color="#040c1a" />
      <stop offset="100%" stop-color="#02060d" />
    </radialGradient>
    
    <!-- Island Aura Gradients -->
    <radialGradient id="penglaiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="avalonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="niflheimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="atlantisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="dilmunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hawaikiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="xibalbaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    
    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="1200" height="700" fill="url(#oceanGrad)" />

  <!-- Navigational Grid / Rhumb Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6" opacity="0.4">
    <circle cx="600" cy="350" r="140" fill="none" />
    <circle cx="600" cy="350" r="280" fill="none" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="0" x2="1200" y2="700" />
    <line x1="0" y1="700" x2="1200" y2="0" />
  </g>

  <!-- Title & Legend -->
  <text x="600" y="55" fill="#f8fafc" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="4">
    THE PRIMORDIAL ARCHIPELAGO
  </text>
  <text x="600" y="82" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">
    CARTOGRAPHY OF GLOBAL MYTHOLOGICAL ISLES &amp; CURRENTS
  </text>

  <!-- Compass Rose Center (The World Axis / Center Sea) -->
  <g transform="translate(600, 350)">
    <circle cx="0" cy="0" r="38" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <polygon points="0,-48 8,-12 32,0 8,12 0,48 -8,12 -32,0 -8,-12" fill="#f59e0b" opacity="0.9" />
    <polygon points="0,-48 -8,-12 0,0" fill="#fbbf24" />
    <polygon points="32,0 8,12 0,0" fill="#d97706" />
    <polygon points="0,48 8,12 0,0" fill="#b45309" />
    <polygon points="-32,0 -8,-12 0,0" fill="#fef3c7" />
    <text x="0" y="5" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">THE AXIS</text>
  </g>

  <!-- 1. NORTH: Niflheim & Jötunheim (Norse Ice Spire) -->
  <g transform="translate(600, 160)">
    <circle cx="0" cy="0" r="85" fill="url(#niflheimGlow)" />
    <!-- Island Landmass -->
    <path d="M-45,-15 L-20,-45 L15,-40 L45,-10 L30,30 L-25,25 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Spire peaks -->
    <polygon points="-10,-40 0,-70 10,-35" fill="#7dd3fc" />
    <polygon points="-25,-20 -15,-50 -5,-20" fill="#38bdf8" />
    <polygon points="10,-20 20,-55 30,-15" fill="#0284c7" />
    <!-- Runes & Labels -->
    <text x="0" y="50" fill="#e0f2fe" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">NIFLHEIM &amp; JÖTUNHEIM</text>
    <text x="0" y="66" fill="#7dd3fc" font-family="sans-serif" font-size="10" text-anchor="middle">Rime Spire &amp; Frost Giant Crags</text>
  </g>

  <!-- 2. EAST: Penglai & Huaguoshan (Chinese Taoist Peak) -->
  <g transform="translate(980, 320)">
    <circle cx="0" cy="0" r="95" fill="url(#penglaiGlow)" />
    <!-- Island Landmass (Karst formations) -->
    <path d="M-40,20 C-50,-20 -10,-45 20,-35 C50,-25 60,10 35,40 C10,55 -30,45 -40,20 Z" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <!-- Karst Spires -->
    <polygon points="-15,10 0,-50 15,10" fill="#059669" />
    <polygon points="10,20 25,-30 35,20" fill="#34d399" />
    <!-- Pagoda roofs -->
    <path d="M-8,-25 L8,-25 L12,-22 L-12,-22 Z" fill="#fbbf24" />
    <circle cx="0" cy="-52" r="3" fill="#fef08a" />
    <!-- Labels -->
    <text x="0" y="65" fill="#d1fae5" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">MOUNT PENGLAI</text>
    <text x="0" y="81" fill="#6ee7b7" font-family="sans-serif" font-size="10" text-anchor="middle">Isle of Immortals &amp; Huaguoshan</text>
  </g>

  <!-- 3. WEST: Tír na nÓg & Avalon (Celtic Eternal Realm) -->
  <g transform="translate(220, 320)">
    <circle cx="0" cy="0" r="95" fill="url(#avalonGlow)" />
    <!-- Island Landmass (Emerald Isle) -->
    <path d="M-35,-20 C-20,-45 25,-40 45,-15 C60,15 35,45 -5,45 C-40,45 -55,10 -35,-20 Z" fill="#3b0764" stroke="#c084fc" stroke-width="2" />
    <!-- Tor & Apple Groves -->
    <ellipse cx="0" cy="-5" rx="20" ry="12" fill="#581c87" />
    <polygon points="-5,-5 0,-35 5,-5" fill="#d8b4fe" />
    <circle cx="-18" cy="10" r="7" fill="#ec4899" opacity="0.8" />
    <circle cx="18" cy="15" r="8" fill="#f43f5e" opacity="0.8" />
    <!-- Labels -->
    <text x="0" y="65" fill="#f3e8ff" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">TÍR NA NÓG &amp; AVALON</text>
    <text x="0" y="81" fill="#c084fc" font-family="sans-serif" font-size="10" text-anchor="middle">Isle of Youth &amp; Silver Apple Mist</text>
  </g>

  <!-- 4. SOUTH: Hawaiki & Onogoroshima (Polynesian / Shinto Cradle) -->
  <g transform="translate(600, 530)">
    <circle cx="0" cy="0" r="95" fill="url(#hawaikiGlow)" />
    <!-- Atoll Ring Landmass -->
    <path d="M-45,0 C-45,-30 45,-30 45,0 C45,30 -45,30 -45,0 Z" fill="none" stroke="#f97316" stroke-width="12" />
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#0284c7" opacity="0.7" />
    <!-- Volcanic Cone -->
    <polygon points="-15,0 0,-30 15,0" fill="#7c2d12" />
    <polygon points="-4,-20 0,-32 4,-20" fill="#f97316" />
    <!-- Labels -->
    <text x="0" y="55" fill="#ffedd5" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle">HAWAIKI &amp; ONOGOROSHIMA</text>
    <text x="0" y="71" fill="#fdba74" font-family="sans-serif" font-size="10" text-anchor="middle">Ancestral Atolls &amp; Brine-Drop Origin</text>
  </g>

  <!-- 5. SOUTH-WEST: Atlantis & Dwarka (Sunken Golden Realms) -->
  <g transform="translate(360, 480)">
    <circle cx="0" cy="0" r="75" fill="url(#atlantisGlow)" />
    <!-- Concentric Rings -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#0891b2" stroke-width="4" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0e7490" stroke-width="3" />
    <circle cx="0" cy="0" r="10" fill="#f59e0b" />
    <line x1="-34" y1="0" x2="34" y2="0" stroke="#06b6d4" stroke-width="2" />
    <line x1="0" y1="-34" x2="0" y2="34" stroke="#06b6d4" stroke-width="2" />
    <!-- Labels -->
    <text x="0" y="52" fill="#cffafe" font-family="serif" font-size="13" font-weight="bold" text-anchor="middle">ATLANTIS &amp; DWARKA</text>
    <text x="0" y="66" fill="#67e8f9" font-family="sans-serif" font-size="9" text-anchor="middle">Submerged Orichalcum &amp; Gold</text>
  </g>

  <!-- 6. SOUTH-EAST: Dilmun & Aaru (Mesopotamian & Egyptian Garden) -->
  <g transform="translate(840, 480)">
    <circle cx="0" cy="0" r="75" fill="url(#dilmunGlow)" />
    <!-- Lush Island & Sun Obelisk -->
    <path d="M-30,-15 C-10,-35 25,-25 35,5 C40,25 0,35 -20,25 C-35,15 -35,-5 -30,-15 Z" fill="#713f12" stroke="#eab308" stroke-width="2" />
    <polygon points="-5,10 0,-30 5,10" fill="#fde047" />
    <polygon points="-3,-25 0,-34 3,-25" fill="#f59e0b" />
    <!-- Labels -->
    <text x="0" y="52" fill="#fef9c3" font-family="serif" font-size="13" font-weight="bold" text-anchor="middle">DILMUN &amp; AARU</text>
    <text x="0" y="66" fill="#fde047" font-family="sans-serif" font-size="9" text-anchor="middle">Field of Reeds &amp; Pure Spring</text>
  </g>

  <!-- 7. NORTH-WEST: Hy-Brasil & Mystery Shroud (Celtic Phantom) -->
  <g transform="translate(360, 200)">
    <circle cx="0" cy="0" r="65" fill="#475569" opacity="0.3" stroke="#94a3b8" stroke-dasharray="3,3" />
    <circle cx="0" cy="0" r="28" fill="#1e293b" opacity="0.7" />
    <!-- Cloaked castle silhouette -->
    <polygon points="-12,8 -8,-15 -2,-15 -2,-5 2,-5 2,-15 8,-15 12,8" fill="#cbd5e1" opacity="0.8" />
    <text x="0" y="44" fill="#cbd5e1" font-family="serif" font-size="12" font-weight="bold" text-anchor="middle">HY-BRASIL</text>
    <text x="0" y="57" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">The 7-Year Shrouded Isle</text>
  </g>

  <!-- 8. NORTH-EAST: Xibalba & Diyu (The River Abyss & Yellow Springs) -->
  <g transform="translate(840, 200)">
    <circle cx="0" cy="0" r="65" fill="url(#xibalbaGlow)" />
    <!-- Jagged Dark Cenote Crag -->
    <path d="M-25,-15 L0,-30 L25,-15 L20,20 L-20,20 Z" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="0" cy="2" r="8" fill="#000000" />
    <text x="0" y="44" fill="#fee2e2" font-family="serif" font-size="12" font-weight="bold" text-anchor="middle">XIBALBA &amp; DIYU</text>
    <text x="0" y="57" fill="#fca5a5" font-family="sans-serif" font-size="9" text-anchor="middle">Cenotes of Trials &amp; Ghost Gate</text>
  </g>

  <!-- Oceanic Currents Flow Indicators -->
  <path d="M 680,180 C 800,200 900,260 930,300" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />
  <path d="M 980,380 C 950,460 900,480 870,490" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />
  <path d="M 520,530 C 440,510 380,470 340,430" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />
  <path d="M 220,260 C 260,200 320,180 520,165" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />

  <!-- Outer Map Border Frame -->
  <rect x="15" y="15" width="1170" height="670" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="22" y="22" width="1156" height="656" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="8,4" />
</svg>
