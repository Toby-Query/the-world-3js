<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="abyssBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#04202c" />
      <stop offset="100%" stop-color="#020d13" />
    </linearGradient>
    <radialGradient id="orichalcumCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="biolumRays" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#083344" stop-opacity="0" />
    </radialGradient>
    <filter id="marineGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Ocean Trench Backdrop -->
  <rect width="800" height="500" fill="url(#abyssBg)" />

  <!-- Downward Ocean Rays / Caustics -->
  <polygon points="150,0 220,0 350,500 240,500" fill="url(#biolumRays)" />
  <polygon points="380,0 470,0 600,500 480,500" fill="url(#biolumRays)" />
  <polygon points="600,0 660,0 750,500 680,500" fill="url(#biolumRays)" />

  <!-- Isometric / Overhead Concentric Ring Structure of Atlantis -->
  <g transform="translate(400, 270) scale(1, 0.42)">
    <!-- Outer Water Canal Ring -->
    <circle cx="0" cy="0" r="320" fill="#0891b2" opacity="0.3" stroke="#22d3ee" stroke-width="3" />
    <!-- Outer Land Ring (Black & Red Basalt Walls) -->
    <circle cx="0" cy="0" r="280" fill="#1e293b" stroke="#e11d48" stroke-width="4" />
    <!-- Middle Water Canal -->
    <circle cx="0" cy="0" r="220" fill="#06b6d4" opacity="0.4" stroke="#67e8f9" stroke-width="3" />
    <!-- Middle Land Ring (White Marble & Brass) -->
    <circle cx="0" cy="0" r="170" fill="#334155" stroke="#f1f5f9" stroke-width="4" />
    <!-- Inner Water Moat -->
    <circle cx="0" cy="0" r="110" fill="#0e7490" opacity="0.6" stroke="#22d3ee" stroke-width="4" />
    <!-- Central Acropolis Island -->
    <circle cx="0" cy="0" r="65" fill="#78350f" stroke="#f59e0b" stroke-width="5" />

    <!-- Radiant Orichalcum Energy Pillar in Center -->
    <circle cx="0" cy="0" r="110" fill="url(#orichalcumCore)" opacity="0.7" />

    <!-- Causeways / Bridges (4 Cardinal Directions) -->
    <line x1="-320" y1="0" x2="320" y2="0" stroke="#f59e0b" stroke-width="6" />
    <line x1="0" y1="-320" x2="0" y2="320" stroke="#f59e0b" stroke-width="6" />
  </g>

  <!-- Vertical 3D Spires & Temples Rising from the Center -->
  <!-- Poseidon's Central Temple (Atlantis) & Golden Vimana Spire (Dwarka) -->
  <g transform="translate(400, 240)">
    <!-- Central Orichalcum Tower -->
    <polygon points="-18,20 0,-140 18,20" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" filter="url(#marineGlow)" />
    <polygon points="-8,-140 0,-175 8,-140" fill="#fffbeb" />
    <!-- Flanking Pillars of Hercules / Dwarka Golden Gopurams -->
    <polygon points="-75,30 -65,-70 -55,30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="55,30 65,-70 75,30" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <polygon points="-120,40 -115,-30 -105,40" fill="#0369a1" />
    <polygon points="105,40 115,-30 120,40" fill="#0369a1" />
  </g>

  <!-- Deep Sea Bioluminescent Fauna & Energy Streamers -->
  <circle cx="210" cy="180" r="3" fill="#22d3ee" filter="url(#marineGlow)" />
  <circle cx="230" cy="160" r="2" fill="#22d3ee" />
  <circle cx="610" cy="220" r="4" fill="#34d399" filter="url(#marineGlow)" />
  <circle cx="580" cy="190" r="2.5" fill="#34d399" />

  <!-- Submerged Bubble Streams -->
  <g fill="#a5f3fc" opacity="0.6">
    <circle cx="395" cy="140" r="2" />
    <circle cx="403" cy="120" r="3" />
    <circle cx="398" cy="95" r="2" />
    <circle cx="402" cy="70" r="3.5" />
  </g>

  <!-- Border & Caption -->
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.6" />
  <text x="30" y="475" fill="#67e8f9" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="2">ATLANTIS &amp; DWARKA • THE CONCENTRIC SUNKEN CITADELS</text>
</svg>
