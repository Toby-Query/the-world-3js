<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aegeanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="aegeanSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="limestoneCliff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bronzeTalos" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="aegeanSunGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="350" fill="url(#aegeanSky)" />

  <!-- Mediterranean Sun -->
  <circle cx="680" cy="90" r="45" fill="#fef08a" filter="url(#aegeanSunGlow)" />

  <!-- Distant Cycladic Islands -->
  <polygon points="50,300 120,240 190,300" fill="#0369a1" opacity="0.6" />
  <polygon points="170,300 240,230 310,300" fill="#0369a1" opacity="0.5" />

  <!-- Aegean Sea Layer -->
  <rect y="300" width="800" height="200" fill="url(#aegeanSea)" />
  <path d="M0,320 Q200,310 400,320 T800,320" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M0,360 Q200,350 400,360 T800,360" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.3" />

  <!-- Main Island Landmass: Limestone Cliffs of Crete / Minos -->
  <polygon points="120,380 200,160 480,140 640,200 750,390" fill="url(#limestoneCliff)" />

  <!-- Palace of Knossos Upper Tier (Terracotta & Red Columns) -->
  <g transform="translate(300, 100)">
    <!-- Palace Platform -->
    <rect x="-80" y="40" width="220" height="15" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    
    <!-- Red Minoan Tapered Columns -->
    <rect x="-60" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="-40" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="-20" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="0" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="40" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="60" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="80" y="10" width="8" height="30" fill="#dc2626" />
    <rect x="100" y="10" width="8" height="30" fill="#dc2626" />
    
    <!-- Palace Architrave -->
    <rect x="-70" y="0" width="200" height="10" fill="#fef3c7" stroke="#b45309" stroke-width="1" />

    <!-- Minoan Horns of Consecration on Roofline -->
    <path d="M 20,-12 C 22,-2 28,0 30,0 C 32,0 38,-2 40,-12 L 35,-12 C 34,-5 32,-3 30,-3 C 28,-3 26,-5 25,-12 Z" fill="#ffffff" stroke="#b45309" stroke-width="1" />
  </g>

  <!-- The Dark Entrance into the Subterranean Labyrinth -->
  <g transform="translate(370, 240)">
    <!-- Great Cyclopean Archway -->
    <path d="M -40,60 L -40,0 C -40,-35 40,-35 40,0 L 40,60 Z" fill="#0f172a" stroke="#451a03" stroke-width="4" />
    <!-- Golden Thread of Ariadne Leading In -->
    <path d="M 120,90 Q 50,70 10,40 Q -10,25 0,10" fill="none" stroke="#fbbf24" stroke-width="2.5" filter="url(#aegeanSunGlow)" />
    <!-- Minotaur Horn Silhouette in Cave Shadows -->
    <path d="M -12,15 C -8,5 -2,0 0,0 C 2,0 8,5 12,15" fill="none" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- The Bronze Colossus Talos (Guarding the Coastline) -->
  <g transform="translate(680, 280)">
    <!-- Bronze Giant Silhouette -->
    <!-- Head & Crest -->
    <circle cx="0" cy="-60" r="10" fill="url(#bronzeTalos)" />
    <polygon points="-3,-74 0,-85 3,-74" fill="#f59e0b" />
    <!-- Torso -->
    <polygon points="-16,-50 16,-50 12,0 -12,0" fill="url(#bronzeTalos)" stroke="#78350f" stroke-width="1" />
    <!-- Left Arm & Boulder -->
    <polygon points="-16,-45 -35,-25 -25,-20 -12,-40" fill="url(#bronzeTalos)" />
    <circle cx="-38" cy="-20" r="14" fill="#475569" stroke="#334155" stroke-width="1" />
    <!-- Right Arm -->
    <polygon points="16,-45 28,-20 22,-18 12,-40" fill="url(#bronzeTalos)" />
    <!-- Legs in Stride across coastal rocks -->
    <polygon points="-10,0 -22,50 -12,50 -2,0" fill="url(#bronzeTalos)" />
    <polygon points="2,0 18,50 28,50 10,0" fill="url(#bronzeTalos)" />
    <!-- Vulnerable Single Vein of Ichor in Ankle -->
    <circle cx="23" cy="42" r="2.5" fill="#ef4444" filter="url(#aegeanSunGlow)" />
  </g>

  <!-- Daedalus & Icarus in Flight (Wax Wings Glider Silhouette in the Sky) -->
  <g transform="translate(240, 90)">
    <circle cx="0" cy="0" r="3" fill="#0f172a" />
    <!-- Feathered Wings -->
    <path d="M 0,0 C -25,-15 -50,-5 -60,10 C -45,0 -20,-3 0,0 Z" fill="#f8fafc" stroke="#d97706" stroke-width="1" />
    <path d="M 0,0 C 25,-15 50,-5 60,10 C 45,0 20,-3 0,0 Z" fill="#f8fafc" stroke="#d97706" stroke-width="1" />
  </g>

  <!-- Caption & Frame -->
  <rect x="10" y="10" width="780" height="480" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6" />
  <text x="30" y="475" fill="#bae6fd" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="2">THE LABYRINTH OF MINOS • AEGEAN SHIFTING MAZE &amp; BRONZE TALOS</text>
</svg>
